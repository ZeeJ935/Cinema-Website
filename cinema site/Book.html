<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="Bstyle.css">
</head>
<body>
    <div class="backgrounds">
        <nav>
            <ul>
            <li><a style="text-decoration: none;" href="cinema.html">Home</a></li>
            <li><a style="text-decoration: none;" href="profile.html">Profile</a></li>
            <li><a href="#">Redeem Points</a></li>
            </ul>
        </nav>
        <div class="cont">
            <h1>Book Your Seat <br> Right Now</h1>
            <p>Select Movie</p>
            <select class="movieboy" name="movie" id="Muvie">
                <option value="">Maula Jett</option>
                <option value="">Avenger Endgame</option>
                <option value="">Rohail King Movie</option>
            </select>
            <p>Select City</p>
            <select class="Cityboy" name="City" id="Cuty">
                <option value="">Lahore</option>
                <option value="">Islamabad</option>
                <option value="">Karachi</option>
            </select>
            <br>
            <p>Select Day</p>
            <select class="dayboy" name="Day" id="Duy">
                <option value="">01-04-23</option>
                <option value="">02-04-23</option>
                <option value="">04 -04-23</option>
            </select>
            <p>Select Time</p>
            <select class="timeboy" name="time" id="Tume">
                <option value="">12:30am</option>
                <option value="">01:30pm</option>
                <option value="">04:30pm</option>
            </select>
            <p>Select Payment Method</p>
            <select class="pesaboy" name="pesa" id="pessa">
                <option value="">Cash</option>
                <option value="">Credit Card</option>
                <option value="">Debit Card</option>
            </select>
            <a href="seatselect.html">Book Now</a>
        </div>
    </div>
</body>
</html>
