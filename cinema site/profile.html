<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Waqar Ahmad">
    <title>Cinema Profile</title>
    <!-- import font icon (fontawesome) -->
    <script src="https://kit.fontawesome.com/b8b432d7d3.js" crossorigin="anonymous"></script>
    <!-- import css file (style.css) -->
    <link rel="stylesheet" href="style3.css">
</head> 
<body>
    <div class="container">

        <div class="profile-card">
            <div class="profile-header"><!-- profile header section -->
             
                <div class="main-profile">
                    <div class="profile-image"></div>
                    <div class="profile-names">
                        <h1 class="username">Waqar A.K Suri</h1>
                        <small class="page-title">Professional & Talented Film Connoisseur</small>
                    </div>
                </div>
            </div>

            <div class="profile-body"><!-- profile body section -->
                <div class="profile-actions">
                    <a style="text-decoration: none;", href="Book.html">
                    <button class="follow">Book Seats</button></a>
                    <button class="message">Watch History</button>
                    <section class="bio">
                        <div class="bio-header">
                            <i class="fa fa-info-circle"></i>
                            Bio
                        </div>
                        <p class="bio-text">
                            Sometimes you don't be watching the film, but the film be watching you.
                        </p>
                    </section>
                </div>

                <div class="account-info">
                    <div class="data">
                        <div class="important-data">
                            <section class="data-item">
                                <h3 class="value"></h3>
                                <small class="title"></small>
                            </section>
                            <section class="data-item">
                                <h3 class="value">Cine Points</h3>
                                <small class="title">890</small>
                            </section>
                            </section>
                            <section class="data-item">
                                <h3 class="value"></h3>
                                <small class="title"></small>
                            </section>
                        </div>
                        <div class="other-data">
                            <section class="data-item">
                                <h3 class="value">Horror</h3>
                                <small class="title">Top Genre</small>
                            </section>
                            <section class="data-item">
                                <h3 class="value">33</h3>
                                <small class="title">Movies watched </small>
                            </section>
                            <section class="data-item">
                                <h3 class="value">2</h3>
                                <small class="title">Reservations</small>
                            </section>
                        </div>
                    </div>

                    <div class="social-media">
                        <span>Linked Accounts:</span>
                        <a href="" class="media-link"><i class="fab fa-facebook-square"></i></a>
                        <a href="" class="media-link"><i class="fab fa-twitter-square"></i></a>
                        <a href="https://www.linkedin.com/in/waqar-a-k-suri-61528784/" class="media-link"><i class="fab fa-linkedin"></i></a>
                        <a href="https://instagram.com/waqar__ak?igshid=YmMyMTA2M2Y=" class="media-link"><i class="fab fa-instagram-square"></i></a>
                        <a href="https://github.com/waqarsuri" class="media-link"><i class="fab fa-github-square"></i></a>
                    </div>

                    <div class="last-post">
                        <div class="post-cover">
                            <span class="last-badge">Last Movie Watched</span>
                        </div>
                        <h3 class="post-title">Amogus the movie</h3>
                        <button class="post-CTA">View</button>
                    </div>
                </div>
            </div>
        </div>

    </div>
</body>
</html>
